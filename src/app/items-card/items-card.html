<div [ngClass]="{'price-photo' : photo.price}" class="card">
    <div class="card-photo">
        <img [src]="photo.imageUrl" [alt]="photo.title">
    </div>
    <div >
        <h3>{{photo.title}}</h3>
        <p>{{photo.description | shorten }}</p>
        <div class="card-footer">
            <p class="category">Category: {{photo.category}}</p>
            <button appChangeElementStyle="orange" routerLink="/items-list/{{photo.id}}" >Детальніше</button>
        </div>
    </div>
</div>
