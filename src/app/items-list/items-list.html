<div>
    <div class="search-bar">
        <input type="text" [(ngModel)]="search" placeholder="Search...">
        <button (click)="onSearch()">Search</button>
    </div>
    <div class="items-list" >
        <div *ngFor="let photo of photos$ | async">
            <app-items-card 
            [photo]="photo" 
            (select)="onItemSelected($event)"
            >
            </app-items-card>
        </div>
    </div>
        
</div>
